# ─────────────────────────────────────────────────────────────────────────────
#  RagVault (Offline AI Knowledge Hub) — Ultra-Lean Docker Compose (~4.1 GB)
#  Services: postgres | chromadb | model-init | llm (llama.cpp) | backend | frontend
#  One-click setup: docker compose up -d
#  100% offline after initial download.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  hub_net:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  hf_cache:
  uploads_temp:

services:

  # ── Model Init (Automatic Zero-Config Model Downloader) ──────────────────────
  model-init:
    image: python:3.11-alpine
    container_name: hub_model_init
    volumes:
      - ./models:/models
      - ./scripts:/scripts
    command: ["python", "/scripts/setup_model.py"]

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hub_postgres
    restart: unless-stopped
    command: postgres -c log_statement=none -c log_min_messages=warning
    networks:
      - hub_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_user} -d ${POSTGRES_DB:-knowledge_hub}" ]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432" # Expose for local dev

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.18
    container_name: hub_chromadb
    restart: unless-stopped
    networks:
      - hub_net
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma_data
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_LOG_LEVEL=WARNING
      - UVICORN_LOG_LEVEL=warning
    volumes:
      - chroma_data:/chroma_data
    ports:
      - "8001:8000" # Expose for local dev inspection

  # ── LLM (llama.cpp Server — High-speed, Ultra-lean C++ Offline Engine) ──────
  llm:
    image: ghcr.io/abetlen/llama-cpp-python:latest
    container_name: hub_llm
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      model-init:
        condition: service_completed_successfully
    volumes:
      - ./models:/models
    entrypoint: ["python3", "-m", "llama_cpp.server"]
    command: ["--model", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "--n_threads", "4", "--n_ctx", "2048"]
    ports:
      - "8080:8000"

  # ── Backend (FastAPI + FastEmbed ONNX ~1.15GB) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hub_backend
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      llm:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://knowledge_user:pg_sec_9d3f82a7b1c4e650@postgres:5432/knowledge_hub}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LLM_BASE_URL=${LLM_BASE_URL:-http://llm:8000/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-1.5b-instruct}
      - HF_HOME=/hf_cache
    volumes:
      - ./backend:/app
      - uploads_temp:/uploads/temp
      - hf_cache:/hf_cache
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'" ]

  # ── Frontend (React + Vite, served via Nginx ~45MB) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hub_frontend
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ── Nginx Reverse Proxy (optional profile) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hub_nginx
    profiles:
      - nginx
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
